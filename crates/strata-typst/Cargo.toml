[package]
name = "strata-typst"
version = "0.1.0"
edition = "2024"

[dependencies]
strata-core = { path = "../strata-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# image-support-handoff.md item 4: リモート URL 画像を render 時に一時ディレクトリへ
# ダウンロードして #image() に渡すための同期 HTTP クライアント。`reqwest` ではなく
# `ureq` を選んだ(裁量、最終報告参照): このクレート(と strata-typst 全体の render
# パイプライン)は非同期ランタイムを一切持たない同期関数のツリーなので、tokio を
# 引き込まずに済む軽量な同期クライアントの方が既存アーキテクチャに馴染む。
ureq = "2"

[dev-dependencies]
# ゴールデン契約テスト(formatted fixture の build → render)専用。ライブラリ本体は
# strata-build に依存しない(strata-core のみ)。
strata-build = { path = "../strata-build" }
